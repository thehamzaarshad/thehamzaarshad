name: Generate button assets

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/theme.py
      - scripts/gen_buttons.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assets
        run: python scripts/gen_buttons.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update button assets"
          git pull --rebase
          git push