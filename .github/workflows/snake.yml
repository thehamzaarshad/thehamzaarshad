name: Generate Snake

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=D9B84A&color_dots=#2B2618,#5C4A14,#8A6D12,#B08D1A,#D9B84A
            dist/github-contribution-grid-snake.svg?color_snake=8A6D12&color_dots=#F3EEDD,#E8DFC0,#D6C27A,#C2A23E,#B08D1A

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}