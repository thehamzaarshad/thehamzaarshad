name: Generate Snake

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=22D3EE&color_dots=#161B22,#3B2F7A,#5B45C9,#7C5CFF,#A78BFA
            dist/github-contribution-grid-snake.svg?color_snake=7C5CFF&color_dots=#EBEDF0,#D6CCFF,#B4A0FF,#8F73FF,#7C5CFF

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}