name: Sync
# Har 5 min: ECG + saare SVG + README + website. Code private repo "Site" mein hai.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sync.yml"]
permissions:
  contents: write
concurrency:
  group: pub-assets
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: pub
      - uses: actions/checkout@v4
        with:
          repository: thehamzaarshad/hamza-site
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: site

      - name: ECG
        continue-on-error: true
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 site/scripts/ecg.py --out pub/assets/ecg.svg

      - name: SVGs + README
        run: python3 site/scripts/gen_assets.py --site site --out pub/assets --readme pub/README.md --json site/src/lib/generated.json

      - name: Commit README + assets
        working-directory: pub
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A README.md assets
          git diff --cached --quiet && exit 0
          git commit -q -m "sync: assets + README"
          git pull --rebase -q
          git push -q

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build website
        working-directory: site
        run: |
          mkdir -p static/assets
          cp ../pub/assets/*.svg static/assets/
          npm ci --silent
          npm run build --silent

      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: thehamzaarshad/thehamzaarshad.github.io
          publish_branch: main
          publish_dir: ./site/build
          force_orphan: true
          commit_message: "deploy"
