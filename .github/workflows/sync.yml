name: Sync
# Har 5 min: ECG + saare SVG + README + website. Code private repo "Site" mein hai.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [site-updated]
  push:
    branches: [main]
    paths: [".github/workflows/sync.yml"]
permissions:
  contents: write
concurrency:
  group: pub-assets
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: pub
      - uses: actions/checkout@v4
        with:
          repository: thehamzaarshad/hamza-site
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: site

      - name: ECG
        continue-on-error: true
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 site/scripts/ecg.py --out pub/assets/ecg.svg

      - name: SVGs + README
        run: python3 site/scripts/gen_assets.py --site site --out pub/assets --readme pub/README.md --json site/src/lib/generated.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build website
        working-directory: site
        run: |
          mkdir -p static/assets
          cp ../pub/assets/*.svg static/assets/
          cp ../pub/assets/*.json static/assets/ 2>/dev/null || true
          npm ci --silent
          npm run build --silent

      - name: CNAME
        working-directory: site
        run: |
          host=$(grep -m1 '^site_url:' profile.txt | sed -E 's|^site_url:[[:space:]]*https?://||; s|/.*||; s|[[:space:]]*$||')
          case "$host" in
            ""|*.github.io) echo "CNAME: github.io, koi custom domain nahi" ;;
            *) echo "$host" > build/CNAME; echo "CNAME: $host" ;;
          esac

      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: thehamzaarshad/thehamzaarshad.github.io
          publish_branch: main
          publish_dir: ./site/build
          force_orphan: true
          commit_message: "deploy"

      - name: Commit README + assets
        if: always()
        working-directory: pub
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A README.md assets
          git diff --cached --quiet && exit 0
          git commit -q -m "sync: assets + README"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q && git push -q; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          [ "$ok" = 1 ]
