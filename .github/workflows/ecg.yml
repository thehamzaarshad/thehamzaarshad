name: ECG
on:
  push:
    branches: [main]
    paths:
      - scripts/ecg.py
      - .github/workflows/ecg.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ecg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ecg.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "ecg-bot"
          git config user.email "ecg-bot@users.noreply.github.com"
          git rm --cached --ignore-unmatch -q assets/ecg.svg
          git add assets/ecg-dark.svg assets/ecg-light.svg
          git diff --cached --quiet || git commit -m "update ECG"
          git push