<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 240" width="100%">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#070b12"/>
 </linearGradient>
 <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22d3a0" stop-opacity=".7"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".7"/>
 </linearGradient>
 <linearGradient id="m" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#000"/><stop offset=".1" stop-color="#fff"/>
  <stop offset=".9" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
 </linearGradient>
 <mask id="fade"><rect x="0" y="70" width="1200" height="130" fill="url(#m)"/></mask>
 <radialGradient id="halo" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#22d3a0" stop-opacity=".18"/><stop offset="1" stop-color="#22d3a0" stop-opacity="0"/>
 </radialGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse" y="10">
  <path d="M30,0 L0,0 L0,30" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
 </pattern>
 <filter id="glow" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
 <path id="b" d="M0,130 L40,130 L52,122 L64,130 L80,130 L88,140 L96,66 L106,158 L114,130 L140,130 L152,116 L168,130 L200,130" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
 <g id="wave">
  <use href="#b" xlink:href="#b" x="0"/><use href="#b" xlink:href="#b" x="200"/>
  <use href="#b" xlink:href="#b" x="400"/><use href="#b" xlink:href="#b" x="600"/>
  <use href="#b" xlink:href="#b" x="800"/><use href="#b" xlink:href="#b" x="1000"/>
  <use href="#b" xlink:href="#b" x="1200"/><use href="#b" xlink:href="#b" x="1400"/>
  <use href="#b" xlink:href="#b" x="1600"/><use href="#b" xlink:href="#b" x="1800"/>
 </g>
</defs>

<rect x="1" y="1" width="1198" height="238" rx="20" fill="url(#bg)" stroke="url(#stroke)" stroke-width="1.5"/>
<ellipse cx="600" cy="130" rx="560" ry="90" fill="url(#halo)"/>
<rect x="20" y="70" width="1160" height="130" fill="url(#grid)"/>

<g font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
 <circle cx="44" cy="40" r="6" fill="#22d3a0"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
 <text x="60" y="46" fill="#e6edf3" font-size="20" font-weight="700" letter-spacing="3">CONTRIBUTION PULSE</text>
 <text x="1160" y="40" fill="#22d3a0" font-size="34" font-weight="800" text-anchor="end" font-family="ui-monospace,Consolas,monospace">72<tspan fill="#8b98a8" font-size="14" font-weight="600" dx="6">BPM</tspan></text>
</g>

<g mask="url(#fade)">
 <g>
  <g stroke="#22d3a0" stroke-width="7" opacity=".35" filter="url(#glow)"><use href="#wave" xlink:href="#wave"/></g>
  <g stroke="#22d3a0" stroke-width="3"><use href="#wave" xlink:href="#wave"/></g>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="3s" repeatCount="indefinite"/>
 </g>
</g>

<g font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
 <rect x="30" y="206" width="89" height="26" rx="13" fill="#22d3a0" fill-opacity=".14" stroke="#22d3a0" stroke-opacity=".5"/>
 <text x="74" y="224" fill="#22d3a0" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">ALIVE</text>
 <text x="1170" y="224" fill="#8b98a8" font-size="14" text-anchor="end" font-family="ui-monospace,Consolas,monospace">Last activity just now · @thehamzaarshad</text>
</g>
</svg>