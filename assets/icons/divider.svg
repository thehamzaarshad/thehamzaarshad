<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2" width="800" height="2" preserveAspectRatio="none">
<defs>
<linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#2DBFFF" stop-opacity="0"/><stop offset=".5" stop-color="#2DBFFF" stop-opacity=".45"/><stop offset="1" stop-color="#2DBFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2DBFFF" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#2DBFFF" stop-opacity="0"/></linearGradient>
</defs>
<rect width="800" height="2" fill="url(#b)"/>
<rect y="0" width="160" height="2" fill="url(#g)">
<animate attributeName="x" from="-160" to="800" dur="3.5s" repeatCount="indefinite"/>
</rect>
</svg>
