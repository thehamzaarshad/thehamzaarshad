<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="Thanks for visiting">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2DBFFF" stop-opacity="0"/><stop offset=".25" stop-color="#2DBFFF"/><stop offset=".75" stop-color="#7C6BFF"/><stop offset="1" stop-color="#7C6BFF" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.w{stroke-dasharray:260 940;animation:m 5s linear infinite}
.w2{stroke-dasharray:160 1040;animation:m 7.5s linear infinite reverse;opacity:.6}
@keyframes m{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
text{font-family:'Segoe UI','Montserrat','Helvetica Neue',Arial,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w,.w2{stroke-dasharray:none}}
</style>
<path d="M0 40 C100 10 200 70 300 40 S500 10 600 40 S800 70 900 40 S1100 10 1200 40" fill="none" stroke="url(#g)" stroke-opacity=".25" stroke-width="2"/>
<path class="w" d="M0 40 C100 10 200 70 300 40 S500 10 600 40 S800 70 900 40 S1100 10 1200 40" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" filter="url(#gl)"/>
<path class="w2" d="M0 40 C100 10 200 70 300 40 S500 10 600 40 S800 70 900 40 S1100 10 1200 40" fill="none" stroke="#2DBFFF" stroke-width="2" stroke-linecap="round"/>
<text x="600" y="80" text-anchor="middle" font-size="15" fill="#8AA0B0">Thanks for visiting. Let's build something great together.</text>
</svg>