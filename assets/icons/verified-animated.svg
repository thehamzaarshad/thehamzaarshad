  <style>
    .badge { transform-box: view-box; transform-origin: 0 0; animation: pop 3s ease-in-out infinite; }
    .shine { animation: sweep 3s ease-in-out infinite; }
    @keyframes pop {
      0%, 60%, 100% { transform: translate(12px,12px) scale(1)    translate(-12px,-12px); }
      12%           { transform: translate(12px,12px) scale(1.12) translate(-12px,-12px); }
      24%           { transform: translate(12px,12px) scale(1)    translate(-12px,-12px); }
    }
    @keyframes sweep {
      0%, 35%  { transform: translateX(-26px); }
      65%, 100% { transform: translateX(26px); }
    }
  </style>
