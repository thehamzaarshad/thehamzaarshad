<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26" fill="none">
<style>
.ax{stroke:#2DBFFF;stroke-opacity:.5;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#2DBFFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:32;stroke-dashoffset:32;animation:d 3s ease-in-out infinite}
.pt{fill:#2DBFFF;opacity:0;animation:pt 3s ease-in-out infinite}
.p2{animation-delay:.25s}.p3{animation-delay:.5s}.p4{animation-delay:.75s}
@keyframes d{0%{stroke-dashoffset:32}50%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-32}}
@keyframes pt{0%,15%{opacity:0}35%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ln{stroke-dashoffset:0}.pt{opacity:1}}
</style>
<path class="ax" d="M3 3v18h18"/>
<path class="ln" d="M6 16l4-5 3.5 3L19 6.5"/>
<circle class="pt" cx="6" cy="16" r="1.5"/>
<circle class="pt p2" cx="10" cy="11" r="1.5"/>
<circle class="pt p3" cx="13.5" cy="14" r="1.5"/>
<circle class="pt p4" cx="19" cy="6.5" r="1.5"/>
</svg>
