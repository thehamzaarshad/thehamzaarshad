<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 836" width="380" height="836" role="img" aria-label="Vitals guide">
<rect x="1" y="1" width="378" height="834" rx="18" fill="#F9F6EE" stroke="#E8DFC0" stroke-width="2"/>
<text x="20" y="32" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="700" font-style="normal" fill="#2B2410">HR (BPM):</tspan><tspan font-weight="400" font-style="normal" fill="#2B2410"> Live effort. Rests at ~70.</tspan></text>
<text x="20" y="54" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">Every recent event (push, PR,</tspan></text>
<text x="20" y="76" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">review, issue) ramps HR up toward</tspan></text>
<text x="20" y="98" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">~130 within minutes, and it recovers</tspan></text>
<text x="20" y="120" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">over ~35 minutes after I stop</tspan></text>
<text x="20" y="156" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="700" font-style="normal" fill="#2B2410">SpO2 (%):</tspan><tspan font-weight="400" font-style="normal" fill="#2B2410"> Oxygen saturation. Healthy</tspan></text>
<text x="20" y="178" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">97-99%, dips about 1% at full</tspan></text>
<text x="20" y="200" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">effort. Consistency (active days)</tspan></text>
<text x="20" y="222" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">nudges it slightly</tspan></text>
<text x="20" y="258" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="700" font-style="normal" fill="#2B2410">NIBP (mmHg):</tspan><tspan font-weight="400" font-style="normal" fill="#2B2410"> Blood pressure. ~118/76</tspan></text>
<text x="20" y="280" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">at rest. Systolic rises up to ~148</tspan></text>
<text x="20" y="302" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">while working, diastolic barely</tspan></text>
<text x="20" y="324" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">moves</tspan></text>
<text x="20" y="360" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="700" font-style="normal" fill="#2B2410">RESP (rpm):</tspan><tspan font-weight="400" font-style="normal" fill="#2B2410"> Breathing. 14 at rest,</tspan></text>
<text x="20" y="382" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">up to 24 while working. The</tspan></text>
<text x="20" y="404" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">breathing sway on the ECG follows it</tspan></text>
<text x="20" y="440" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="700" font-style="normal" fill="#2B2410">HRV (RMSSD ms):</tspan><tspan font-weight="400" font-style="normal" fill="#2B2410"> Variability. 35-60</tspan></text>
<text x="20" y="462" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">ms at rest depending on consistency,</tspan></text>
<text x="20" y="484" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">drops while working</tspan></text>
<text x="20" y="520" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="700" font-style="normal" fill="#2B2410">NEWS2:</tspan><tspan font-weight="400" font-style="normal" fill="#2B2410"> Overall early-warning score.</tspan></text>
<text x="20" y="542" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">The NHS NEWS2 banding applied to HR,</tspan></text>
<text x="20" y="564" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">SpO2, systolic BP and RR</tspan></text>
<text x="20" y="600" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="700" font-style="normal" fill="#2B2410">Rhythms:</tspan><tspan font-weight="400" font-style="normal" fill="#2B2410"> normal sinus rhythm at</tspan></text>
<text x="20" y="622" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">rest, tachycardia while working</tspan></text>
<text x="20" y="644" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">hard, then back to normal. After 2+</tspan></text>
<text x="20" y="666" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">days of no activity: bradycardia →</tspan></text>
<text x="20" y="688" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">irregular rhythm (PVCs) →</tspan><tspan font-weight="700" font-style="normal" fill="#2B2410"> asystole</tspan></text>
<text x="20" y="710" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">after 7 days with no activity.</tspan></text>
<text x="20" y="746" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="700" font-style="normal" fill="#2B2410">Alarms:</tspan><tspan font-weight="400" font-style="normal" fill="#2B2410"> NEWS2 5-6 =</tspan><tspan font-weight="400" font-style="italic" fill="#2B2410"> urgent review</tspan><tspan font-weight="400" font-style="normal" fill="#2B2410"> ,</tspan></text>
<text x="20" y="768" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">NEWS2 7+ =</tspan><tspan font-weight="400" font-style="italic" fill="#2B2410"> escalate</tspan><tspan font-weight="400" font-style="normal" fill="#2B2410"> . The bottom</tspan></text>
<text x="20" y="790" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">strip shows my last 30 days of</tspan></text>
<text x="20" y="812" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#2B2410">contributions.</tspan></text>
</svg>
