<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 980" width="380" height="980" role="img" aria-label="How to read my vitals">
<rect x="1" y="1" width="378" height="978" rx="18" fill="#2C1F2B" stroke="#DCA54C" stroke-opacity="0.4" stroke-width="2"/>
<polygon points="22,27 34,27 28,37" fill="#DCA54C"/>
<g transform="translate(42 22) scale(1.1)"><path d="M1 10h4l2-5.5 4 11 2-5.5h6" stroke="#DCA54C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<text x="72" y="38" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="17" fill="#DCA54C">How to read my vitals</text>
<text x="22" y="72" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#F2E6C9" fill-opacity="0.78">Live reading, updated 26 Nov, 13:00 PKT</text>
<rect x="14" y="88" width="352" height="121" rx="12" fill="none" stroke="#DCA54C" stroke-opacity="0.2" stroke-width="1.5"/>
<text x="28" y="116" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14.5" fill="#F2E6C9">HR (BPM)</text>
<text x="352" y="118" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="21" fill="#DCA54C">89</text>
<text x="28" y="140" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Live effort. Rests at ~70. Every recent</tspan></text>
<text x="28" y="159" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">event (push, PR, review, issue) ramps HR</tspan></text>
<text x="28" y="178" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">up toward ~130 within minutes, and it</tspan></text>
<text x="28" y="197" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">recovers over ~35 minutes after I stop</tspan></text>
<rect x="14" y="219" width="352" height="102" rx="12" fill="none" stroke="#DCA54C" stroke-opacity="0.2" stroke-width="1.5"/>
<text x="28" y="247" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14.5" fill="#F2E6C9">SpO2 (%)</text>
<text x="352" y="249" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="21" fill="#DCA54C">98</text>
<text x="28" y="271" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Oxygen saturation. Healthy 97-99%, dips</tspan></text>
<text x="28" y="290" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">about 1% at full effort. Consistency</tspan></text>
<text x="28" y="309" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">(active days) nudges it slightly</tspan></text>
<rect x="14" y="331" width="352" height="102" rx="12" fill="none" stroke="#DCA54C" stroke-opacity="0.2" stroke-width="1.5"/>
<text x="28" y="359" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14.5" fill="#F2E6C9">NIBP (mmHg)</text>
<text x="352" y="361" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="21" fill="#DCA54C">124/80</text>
<text x="28" y="383" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Blood pressure. ~118/76 at rest. Systolic</tspan></text>
<text x="28" y="402" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">rises up to ~148 while working, diastolic</tspan></text>
<text x="28" y="421" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">barely moves</tspan></text>
<rect x="14" y="443" width="352" height="102" rx="12" fill="none" stroke="#DCA54C" stroke-opacity="0.2" stroke-width="1.5"/>
<text x="28" y="471" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14.5" fill="#F2E6C9">RESP (rpm)</text>
<text x="352" y="473" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="21" fill="#DCA54C">17</text>
<text x="28" y="495" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Breathing. 14 at rest, up to 24 while</tspan></text>
<text x="28" y="514" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">working. The breathing sway on the ECG</tspan></text>
<text x="28" y="533" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">follows it</tspan></text>
<rect x="14" y="555" width="352" height="83" rx="12" fill="none" stroke="#DCA54C" stroke-opacity="0.2" stroke-width="1.5"/>
<text x="28" y="583" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14.5" fill="#F2E6C9">HRV (RMSSD ms)</text>
<text x="352" y="585" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="21" fill="#DCA54C">42</text>
<text x="28" y="607" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Variability. 35-60 ms at rest depending on</tspan></text>
<text x="28" y="626" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">consistency, drops while working</tspan></text>
<rect x="14" y="648" width="352" height="102" rx="12" fill="none" stroke="#DCA54C" stroke-opacity="0.2" stroke-width="1.5"/>
<text x="28" y="676" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14.5" fill="#F2E6C9">NEWS2</text>
<text x="352" y="678" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="21" fill="#DCA54C">0</text>
<text x="28" y="700" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Overall early-warning score. The NHS NEWS2</tspan></text>
<text x="28" y="719" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">banding applied to HR, SpO2, systolic BP</tspan></text>
<text x="28" y="738" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">and RR</tspan></text>
<text x="22" y="780" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill-opacity="0.85"><tspan font-weight="700" font-style="normal" fill="#F2E6C9">Rhythms:</tspan><tspan font-weight="400" font-style="normal" fill="#F2E6C9"> normal sinus rhythm at rest,</tspan></text>
<text x="22" y="800" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">tachycardia while working hard, then</tspan></text>
<text x="22" y="820" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">back to normal. After 2+ days of no</tspan></text>
<text x="22" y="840" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">activity: bradycardia → irregular rhythm</tspan></text>
<text x="22" y="860" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">(PVCs) →</tspan><tspan font-weight="700" font-style="normal" fill="#F2E6C9"> asystole</tspan><tspan font-weight="400" font-style="normal" fill="#F2E6C9"> after 7 days with no</tspan></text>
<text x="22" y="880" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">activity.</tspan></text>
<text x="22" y="912" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill-opacity="0.85"><tspan font-weight="700" font-style="normal" fill="#F2E6C9">Alarms:</tspan><tspan font-weight="400" font-style="normal" fill="#F2E6C9"> NEWS2 5-6 =</tspan><tspan font-weight="400" font-style="italic" fill="#F2E6C9"> urgent review</tspan><tspan font-weight="400" font-style="normal" fill="#F2E6C9">, NEWS2</tspan></text>
<text x="22" y="932" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">7+ =</tspan><tspan font-weight="400" font-style="italic" fill="#F2E6C9"> escalate</tspan><tspan font-weight="400" font-style="normal" fill="#F2E6C9">. The bottom strip shows my</tspan></text>
<text x="22" y="952" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">last 30 days of contributions.</tspan></text>
</svg>
