<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 906" width="380" height="906" role="img" aria-label="Vitals guide">
<rect x="1" y="1" width="378" height="904" rx="18" fill="#2C1F2B" stroke="#4F3B3A" stroke-width="2"/>
<text x="20" y="28" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#F2E6C9" fill-opacity="0.78">Live reading, updated 25 Nov, 20:04</text>
<text x="20" y="60" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#F2E6C9">HR (BPM)</text>
<text x="360" y="62" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#DCA54C">82</text>
<text x="20" y="84" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Live effort. Rests at ~70. Every recent</tspan></text>
<text x="20" y="104" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">event (push, PR, review, issue) ramps HR</tspan></text>
<text x="20" y="124" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">up toward ~130 within minutes, and it</tspan></text>
<text x="20" y="144" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">recovers over ~35 minutes after I stop</tspan></text>
<text x="20" y="182" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#F2E6C9">SpO2 (%)</text>
<text x="360" y="184" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#DCA54C">98</text>
<text x="20" y="206" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Oxygen saturation. Healthy 97-99%, dips</tspan></text>
<text x="20" y="226" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">about 1% at full effort. Consistency</tspan></text>
<text x="20" y="246" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">(active days) nudges it slightly</tspan></text>
<text x="20" y="284" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#F2E6C9">NIBP (mmHg)</text>
<text x="360" y="286" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#DCA54C">130/76</text>
<text x="20" y="308" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Blood pressure. ~118/76 at rest.</tspan></text>
<text x="20" y="328" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Systolic rises up to ~148 while working,</tspan></text>
<text x="20" y="348" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">diastolic barely moves</tspan></text>
<text x="20" y="386" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#F2E6C9">RESP (rpm)</text>
<text x="360" y="388" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#DCA54C">18</text>
<text x="20" y="410" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Breathing. 14 at rest, up to 24 while</tspan></text>
<text x="20" y="430" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">working. The breathing sway on the ECG</tspan></text>
<text x="20" y="450" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">follows it</tspan></text>
<text x="20" y="488" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#F2E6C9">HRV (RMSSD ms)</text>
<text x="360" y="490" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#DCA54C">82</text>
<text x="20" y="512" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Variability. 35-60 ms at rest depending</tspan></text>
<text x="20" y="532" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">on consistency, drops while working</tspan></text>
<text x="20" y="570" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#F2E6C9">NEWS2</text>
<text x="360" y="572" text-anchor="end" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="20" fill="#DCA54C">0</text>
<text x="20" y="594" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">Overall early-warning score. The NHS</tspan></text>
<text x="20" y="614" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">NEWS2 banding applied to HR, SpO2,</tspan></text>
<text x="20" y="634" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill-opacity="0.85"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">systolic BP and RR</tspan></text>
<text x="20" y="670" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="700" font-style="normal" fill="#F2E6C9">Rhythms:</tspan><tspan font-weight="400" font-style="normal" fill="#F2E6C9"> normal sinus rhythm at</tspan></text>
<text x="20" y="692" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">rest, tachycardia while working</tspan></text>
<text x="20" y="714" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">hard, then back to normal. After 2+</tspan></text>
<text x="20" y="736" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">days of no activity: bradycardia →</tspan></text>
<text x="20" y="758" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">irregular rhythm (PVCs) →</tspan><tspan font-weight="700" font-style="normal" fill="#F2E6C9"> asystole</tspan></text>
<text x="20" y="780" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">after 7 days with no activity.</tspan></text>
<text x="20" y="816" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="700" font-style="normal" fill="#F2E6C9">Alarms:</tspan><tspan font-weight="400" font-style="normal" fill="#F2E6C9"> NEWS2 5-6 =</tspan><tspan font-weight="400" font-style="italic" fill="#F2E6C9"> urgent review</tspan><tspan font-weight="400" font-style="normal" fill="#F2E6C9">,</tspan></text>
<text x="20" y="838" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">NEWS2 7+ =</tspan><tspan font-weight="400" font-style="italic" fill="#F2E6C9"> escalate</tspan><tspan font-weight="400" font-style="normal" fill="#F2E6C9">. The bottom</tspan></text>
<text x="20" y="860" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">strip shows my last 30 days of</tspan></text>
<text x="20" y="882" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"><tspan font-weight="400" font-style="normal" fill="#F2E6C9">contributions.</tspan></text>
</svg>
